[project]
name = "perdix"
version = "0.0.0"
description = "Perdix Agent server (ACP over stdio)"
requires-python = ">=3.12"
dependencies = [
  "agent-client-protocol==0.12.*",
  "anthropic>=1.11,<2",
  "openai>=3.0,<4",
  "pydantic>=2.9",
  "aiosqlite",
  "jsonschema>=4.26.0",
]

[project.scripts]
perdix-server = "perdix.__main__:main"

[dependency-groups]
dev = [
    "pytest",
    "pytest-asyncio",
    "ruff",
    "mypy",
    "types-jsonschema>=4.26.0.20261006",
]

[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[tool.hatch.build.targets.wheel]
packages = ["src/perdix"]

[tool.pytest.ini_options]
asyncio_mode = "auto"
testpaths = ["tests"]

[tool.ruff]
line-length = 100
src = ["src", "tests"]

[tool.ruff.lint]
select = ["E", "F", "I", "UP", "B"]

[tool.mypy]
strict = true
mypy_path = "src"
