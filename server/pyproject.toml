[project]
name = "perdix"
version = "0.0.0"
description = "Perdix Agent server (ACP over stdio)"
requires-python = ">=3.12"
dependencies = [
  "agent-client-protocol==0.12.*",
  "anthropic>=1.11,<2",
  "openai>=3.0,<4",
  "pydantic>=2.9",
  "aiosqlite",
  "jsonschema>=4.26.0",
  "httpx2[http2,brotli,zstd]",
  "truststore>=0.10,<1",
  "PyJWT[crypto]>=2.10,<3",
  "filelock>=4.1,<5",
  "fastapi>=0.115,<1",
  "uvicorn>=0.30,<1",
]

[project.scripts]
perdix-server = "perdix.__main__:main"
perdix-gateway = "perdix.gateway.__main__:main"
perdix-modelapi = "perdix.modelapi.__main__:main"

[dependency-groups]
dev = [
    "pytest",
    "pytest-asyncio",
    "ruff",
    "mypy",
    "types-jsonschema>=4.26.0.20261006",
]

[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[tool.hatch.build.targets.wheel]
packages = ["src/perdix"]

[tool.ruff]
line-length = 100
src = ["src"]

[tool.ruff.lint]
select = ["E", "F", "I", "UP", "B"]

[tool.mypy]
strict = true
mypy_path = "src"
