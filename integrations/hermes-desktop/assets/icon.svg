<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1024 1024" width="1024" height="1024">
  <!-- Perdix 앱 아이콘: 노드와 네온 선으로 이은 자고새 별자리(워크플로 그래프). macOS 그리드(824px 판, 100px 여백). -->
  <defs>
    <linearGradient id="bg" x1="0" y1="0" x2="1" y2="1">
      <stop offset="0" stop-color="#121633"/>
      <stop offset="1" stop-color="#05060d"/>
    </linearGradient>
    <radialGradient id="glow" cx="0.58" cy="0.46" r="0.5">
      <stop offset="0" stop-color="#7c5cff" stop-opacity="0.32"/>
      <stop offset="1" stop-color="#7c5cff" stop-opacity="0"/>
    </radialGradient>
    <linearGradient id="line" x1="0" y1="1" x2="1" y2="0">
      <stop offset="0" stop-color="#22d3ee"/>
      <stop offset="0.5" stop-color="#8b7bff"/>
      <stop offset="1" stop-color="#f472b6"/>
    </linearGradient>
    <filter id="neon" filterUnits="userSpaceOnUse" x="0" y="0" width="1024" height="1024">
      <feGaussianBlur stdDeviation="9" result="blur"/>
      <feMerge><feMergeNode in="blur"/><feMergeNode in="blur"/><feMergeNode in="SourceGraphic"/></feMerge>
    </filter>
    <clipPath id="plate"><rect x="100" y="100" width="824" height="824" rx="185"/></clipPath>
  </defs>

  <rect x="100" y="100" width="824" height="824" rx="185" fill="url(#bg)"/>
  <rect x="100" y="100" width="824" height="824" rx="185" fill="url(#glow)"/>

  <!-- 배경 별 -->
  <g clip-path="url(#plate)" fill="#ffffff">
    <circle cx="205" cy="230" r="3" opacity="0.5"/><circle cx="300" cy="170" r="2" opacity="0.4"/>
    <circle cx="820" cy="210" r="3" opacity="0.5"/><circle cx="870" cy="300" r="2" opacity="0.35"/>
    <circle cx="180" cy="420" r="2" opacity="0.35"/><circle cx="860" cy="560" r="3" opacity="0.45"/>
    <circle cx="210" cy="820" r="3" opacity="0.4"/><circle cx="760" cy="860" r="2" opacity="0.4"/>
    <circle cx="420" cy="240" r="2" opacity="0.3"/><circle cx="330" cy="860" r="2" opacity="0.3"/>
  </g>

  <!-- 별자리 선 -->
  <g filter="url(#neon)" fill="none" stroke="url(#line)" stroke-width="13" stroke-linecap="round" stroke-linejoin="round">
    <!-- 윤곽: 꼬리끝-꼬리뿌리-등-목덜미-정수리-부리-목-가슴-배-아랫배-꼬리뿌리 -->
    <path d="M232 590 L 330 520 L 455 430 L 598 372 L 668 330 L 778 372 L 690 430 L 712 540 L 620 650 L 450 655 L 330 520"/>
    <!-- 날개 -->
    <path d="M455 430 L 500 545 L 620 650 M 500 545 L 712 540"/>
    <!-- 다리 -->
    <path d="M520 655 L 500 775 M 600 652 L 625 775"/>
  </g>

  <!-- 노드 -->
  <g filter="url(#neon)">
    <circle cx="232" cy="590" r="17" fill="#22d3ee"/>
    <circle cx="330" cy="520" r="19" fill="#38bdf8"/>
    <circle cx="455" cy="430" r="19" fill="#60a5fa"/>
    <circle cx="598" cy="372" r="17" fill="#8b7bff"/>
    <circle cx="668" cy="330" r="21" fill="#a78bfa"/>
    <circle cx="778" cy="372" r="17" fill="#f472b6"/>
    <circle cx="690" cy="430" r="14" fill="#e879f9"/>
    <circle cx="712" cy="540" r="19" fill="#d946ef"/>
    <circle cx="620" cy="650" r="17" fill="#a78bfa"/>
    <circle cx="450" cy="655" r="17" fill="#60a5fa"/>
    <circle cx="500" cy="545" r="26" fill="#ffffff"/>
    <circle cx="500" cy="775" r="13" fill="#22d3ee"/>
    <circle cx="625" cy="775" r="13" fill="#22d3ee"/>
  </g>

  <!-- 눈 -->
  <circle cx="676" cy="378" r="15" fill="none" stroke="#ffffff" stroke-width="7" filter="url(#neon)"/>
</svg>
